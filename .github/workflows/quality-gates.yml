name: Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: forge-server/pom.xml

      - name: Show available commands
        run: make help

      - name: Run blocking quality gates
        run: make ci

      - name: Reject whitespace errors in the diff
        run: git diff --check HEAD
