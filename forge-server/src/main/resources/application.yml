spring:
  application:
    name: forge-server
  datasource:
    url: ${FORGE_MYSQL_URL}
    username: ${FORGE_MYSQL_USERNAME}
    password: ${FORGE_MYSQL_PASSWORD}
  data:
    redis:
      host: ${FORGE_REDIS_HOST}
      port: ${FORGE_REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  session:
    timeout: ${FORGE_SESSION_IDLE_TIMEOUT:30m}
    redis:
      namespace: forge:session

server:
  servlet:
    session:
      cookie:
        name: FORGE_SESSION
        http-only: true
        secure: ${FORGE_SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /

forge:
  branding:
    storage-directory: ${FORGE_BRANDING_STORAGE_DIRECTORY:data/branding}
  security:
    secret-master-key: ${FORGE_SECRET_MASTER_KEY}
    secret-key-version: ${FORGE_SECRET_KEY_VERSION:1}
  web:
    allowed-origins: ${FORGE_ALLOWED_ORIGINS:https://localhost}
  auth:
    absolute-session-timeout: ${FORGE_SESSION_ABSOLUTE_TIMEOUT:12h}
    failed-login-threshold: ${FORGE_FAILED_LOGIN_THRESHOLD:5}
    account-lock-duration: ${FORGE_ACCOUNT_LOCK_DURATION:15m}
    rate-limit-attempts: ${FORGE_LOGIN_RATE_LIMIT_ATTEMPTS:10}
    rate-limit-window: ${FORGE_LOGIN_RATE_LIMIT_WINDOW:5m}
  infrastructure:
    agent:
      base-url: ${FORGE_AGENT_BASE_URL}
      health-timeout: 1s
      token-ttl: 30s
      jwt-secret: ${FORGE_AGENT_INTERNAL_JWT_SECRET}
    qdrant:
      base-url: ${FORGE_QDRANT_BASE_URL}
      health-timeout: 1s
  rag:
    embedding:
      dimension: ${FORGE_RAG_EMBEDDING_DIMENSION:64}
    qdrant:
      request-timeout: ${FORGE_RAG_QDRANT_TIMEOUT:10s}
    indexer:
      schedule-enabled: ${FORGE_RAG_INDEXER_SCHEDULE_ENABLED:true}
      poll-interval: ${FORGE_RAG_INDEXER_POLL_INTERVAL:5s}
      dispatch-batch-size: ${FORGE_RAG_INDEXER_BATCH_SIZE:50}
      max-attempts: ${FORGE_RAG_INDEXER_MAX_ATTEMPTS:5}
      backoff-base: ${FORGE_RAG_INDEXER_BACKOFF_BASE:10s}
      lease: ${FORGE_RAG_INDEXER_LEASE:5m}
  gitlab:
    allow-local-http: ${FORGE_GITLAB_ALLOW_LOCAL_HTTP:false}
    private-cidr-allowlist: ${FORGE_GITLAB_PRIVATE_CIDR_ALLOWLIST:}
    request-timeout: ${FORGE_GITLAB_REQUEST_TIMEOUT:5s}
    max-response-bytes: ${FORGE_GITLAB_MAX_RESPONSE_BYTES:1048576}
    max-log-tail-bytes: ${FORGE_GITLAB_MAX_LOG_TAIL_BYTES:65536}
    webhook:
      max-payload-bytes: ${FORGE_GITLAB_WEBHOOK_MAX_PAYLOAD_BYTES:262144}
      schedule-enabled: ${FORGE_GITLAB_WEBHOOK_SCHEDULE_ENABLED:true}
      poll-interval: ${FORGE_GITLAB_WEBHOOK_POLL_INTERVAL:1s}
      lease: ${FORGE_GITLAB_WEBHOOK_LEASE:1m}
      max-attempts: ${FORGE_GITLAB_WEBHOOK_MAX_ATTEMPTS:5}
      backoff-base: ${FORGE_GITLAB_WEBHOOK_BACKOFF_BASE:5s}

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,5s
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        readiness:
          include: readinessState,db,redis
    prometheus:
      access: read-only
  health:
    status:
      order: DOWN,OUT_OF_SERVICE,DEGRADED,UNKNOWN,UP
      http-mapping:
        degraded: 200

springdoc:
  paths-to-match: /api/v1/**
  show-actuator: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: logstash
