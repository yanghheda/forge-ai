<!--
  ForgeAI Console · 应用外壳共享片段（SharedFragmentOnly）
  归属生成节点：gen-project-shell
  继承方：所有登录后的内页（pages/ 下除 login / init-wizard 外的全部页面）
  用法（叶子页面必须严格遵守）：
    1. 将本文件“从 BEGIN APP SHELL 到 END APP SHELL”的全部内容原样复制到你的 <body> 内。
    2. 当前页高亮（activeNavItem 插槽）：在对应 <a class="menu-item" data-nav-key="..."> 上设置
       data-active="true"，每页恰好一个；禁止改写导航结构/样式。
    3. 替换两处插槽注释：
       <!-- SLOT:breadcrumb -->   面包屑（arco-breadcrumb）
       <!-- SLOT:pageContent -->  页面主体（写入 <div class="page-container">...</div>）
    4. 不要改动任何 data-dom-id / data-nav-key；本片段已内置全局导航所需的全部 data-dom-id。
    5. 组件样式只允许使用 var(--forge-*) 令牌，禁止硬编码色值。
    6. 共享 <footer> 为外壳所有，保持原样，不要在页面内容里重复页脚。
-->
<!-- BEGIN APP SHELL -->
<style id="critical-components">
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--forge-text-1); background: var(--forge-background); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--forge-scrollbar); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--forge-scrollbar-hover); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============ 应用骨架 ============ */
  .app-shell { display: flex; height: 100vh; overflow: hidden; }
  .app-sidebar {
    width: var(--forge-sidebar-width); flex: 0 0 var(--forge-sidebar-width);
    background: var(--forge-sidebar); color: var(--forge-sidebar-text);
    display: flex; flex-direction: column; height: 100vh;
  }
  .app-brand {
    height: var(--forge-header-height); display: flex; align-items: center; gap: 10px;
    padding: 0 16px; border-bottom: 1px solid var(--forge-sidebar-border); flex: none;
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 6px; flex: none;
    background: linear-gradient(135deg, var(--forge-primary-5), var(--forge-primary-7));
    display: grid; place-items: center; color: var(--forge-primary-foreground); font-weight: 700; font-size: 15px;
  }
  .brand-name { color: var(--forge-text-inverse); font-size: 15px; font-weight: 600; letter-spacing: .2px; line-height: 1.2; }
  .brand-sub { font-size: 11px; color: var(--forge-sidebar-text-dim); margin-top: 1px; }

  .app-switcher {
    margin: 10px 12px 4px; padding: 8px 10px; border-radius: var(--forge-radius-sm);
    background: var(--forge-sidebar-chip); border: 1px solid var(--forge-sidebar-chip-border);
    display: flex; align-items: center; gap: 8px; cursor: pointer; flex: none;
    transition: background-color .15s ease;
  }
  .app-switcher:hover { background: var(--forge-sidebar-hover); }
  .switcher-avatar {
    width: 26px; height: 26px; border-radius: 4px; flex: none;
    background: var(--forge-sidebar-active-bg); color: var(--forge-primary-2); font-size: 11px; font-weight: 700;
    display: grid; place-items: center;
  }
  .switcher-meta { min-width: 0; flex: 1; }
  .switcher-org { font-size: 12px; color: var(--forge-text-inverse); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .switcher-proj { font-size: 11px; color: var(--forge-sidebar-text-dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .app-menu { flex: 1; overflow-y: auto; padding: 8px 8px 16px; }
  .menu-group-title {
    padding: 14px 12px 6px; font-size: 12px; color: var(--forge-sidebar-text-faint); letter-spacing: .4px;
  }
  .menu-item {
    position: relative; display: flex; align-items: center; gap: 10px;
    height: 36px; padding: 0 12px; margin: 2px 0; border-radius: var(--forge-radius-sm);
    font-size: 14px; color: var(--forge-sidebar-text); cursor: pointer; white-space: nowrap;
    transition: background-color .15s ease, color .15s ease;
  }
  .menu-item .icon { width: 16px; height: 16px; flex: none; opacity: .9; }
  .menu-item:hover { background: var(--forge-sidebar-hover); color: var(--forge-text-inverse); }
  .menu-item[data-active="true"] { background: var(--forge-sidebar-active-bg); color: var(--forge-text-inverse); font-weight: 500; }
  .menu-item[data-active="true"]::before {
    content: ""; position: absolute; left: -8px; top: 7px; bottom: 7px; width: 3px;
    border-radius: 0 2px 2px 0; background: var(--forge-sidebar-active-bar);
  }
  .menu-item .menu-badge { margin-left: auto; }

  .app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .app-header {
    height: var(--forge-header-height); flex: none; background: var(--forge-card);
    border-bottom: 1px solid var(--forge-border-2);
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
  }
  .header-spacer { flex: 1; }
  .header-search {
    width: 220px; height: 32px; display: flex; align-items: center; gap: 8px;
    padding: 0 10px; border: 1px solid var(--forge-border-2); border-radius: var(--forge-radius-sm);
    background: var(--forge-fill-1); color: var(--forge-text-3); font-size: 13px; cursor: text;
    transition: border-color .15s ease, background-color .15s ease;
  }
  .header-search:hover { border-color: var(--forge-primary-5); background: var(--forge-card); }
  .header-search kbd {
    margin-left: auto; font-family: var(--forge-font-sans); font-size: 11px; color: var(--forge-text-3);
    border: 1px solid var(--forge-border-2); border-bottom-width: 2px; border-radius: 2px; padding: 0 5px; background: var(--forge-card);
  }
  .header-icon-btn {
    position: relative; width: 32px; height: 32px; border-radius: var(--forge-radius-sm);
    display: grid; place-items: center; color: var(--forge-text-2); cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
  }
  .header-icon-btn:hover { background: var(--forge-fill-2); color: var(--forge-text-1); }
  .header-user { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: var(--forge-radius-sm); cursor: pointer; }
  .header-user:hover { background: var(--forge-fill-2); }
  .header-user .uname { font-size: 13px; color: var(--forge-text-1); }

  .app-content { flex: 1; overflow: auto; }
  .page-container { padding: var(--forge-content-padding); max-width: 1440px; margin: 0 auto; }
  .app-footer {
    flex: none; border-top: 1px solid var(--forge-border-1); background: var(--forge-card);
    padding: 10px 20px; display: flex; align-items: center; gap: 16px;
    font-size: 12px; color: var(--forge-text-3);
  }
  .app-footer .footer-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--forge-success); }
  .app-footer .footer-right { margin-left: auto; display: flex; gap: 16px; align-items: center; }
  .app-footer .footer-link { cursor: pointer; }
  .app-footer .footer-link:hover { color: var(--forge-primary-6); }

  /* ============ 图标 ============ */
  .icon { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }

  /* ============ 文字辅助 ============ */
  .t1 { color: var(--forge-text-1); } .t2 { color: var(--forge-text-2); }
  .t3 { color: var(--forge-text-3); } .t4 { color: var(--forge-text-4); }
  .fs-xs { font-size: var(--forge-text-xs); } .fs-sm { font-size: var(--forge-text-sm); }
  .fs-md { font-size: var(--forge-text-md); } .fs-lg { font-size: var(--forge-text-lg); }
  .fw-500 { font-weight: 500; } .fw-600 { font-weight: 600; }
  .mono { font-family: var(--forge-font-mono); }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ============ 按钮 Arco Button ============ */
  .arco-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 15px; font-size: 14px; line-height: 1;
    border: 1px solid transparent; border-radius: var(--forge-radius-sm);
    background: var(--forge-card); color: var(--forge-text-1); cursor: pointer; white-space: nowrap;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .arco-btn .icon { width: 14px; height: 14px; }
  .arco-btn-sm { height: 28px; padding: 0 11px; font-size: 13px; }
  .arco-btn-lg { height: 36px; padding: 0 19px; font-size: 14px; }
  .arco-btn-primary { background: var(--forge-primary-6); color: var(--forge-primary-foreground); border-color: var(--forge-primary-6); }
  .arco-btn-primary:hover { background: var(--forge-primary-5); border-color: var(--forge-primary-5); }
  .arco-btn-primary:active { background: var(--forge-primary-7); border-color: var(--forge-primary-7); }
  .arco-btn-secondary { background: var(--forge-fill-2); border-color: transparent; color: var(--forge-text-1); }
  .arco-btn-secondary:hover { background: var(--forge-fill-3); }
  .arco-btn-outline { background: var(--forge-card); border-color: var(--forge-border-2); color: var(--forge-text-2); }
  .arco-btn-outline:hover { color: var(--forge-primary-6); border-color: var(--forge-primary-6); background: var(--forge-primary-1); }
  .arco-btn-dashed { background: var(--forge-card); border: 1px dashed var(--forge-border-3); color: var(--forge-text-2); }
  .arco-btn-dashed:hover { color: var(--forge-primary-6); border-color: var(--forge-primary-6); background: var(--forge-primary-1); }
  .arco-btn-text { background: transparent; border-color: transparent; color: var(--forge-text-2); padding-left: 8px; padding-right: 8px; }
  .arco-btn-text:hover { background: var(--forge-fill-2); color: var(--forge-text-1); }
  .arco-btn-danger-primary { background: var(--forge-error); border-color: var(--forge-error); color: var(--forge-primary-foreground); }
  .arco-btn-danger-primary:hover { background: var(--forge-error-5); border-color: var(--forge-error-5); }
  .arco-btn-danger-outline { background: var(--forge-card); border-color: var(--forge-border-2); color: var(--forge-error); }
  .arco-btn-danger-outline:hover { border-color: var(--forge-error); background: var(--forge-error-bg); }
  .arco-btn[disabled], .arco-btn.is-disabled { background: var(--forge-fill-2); color: var(--forge-text-4); border-color: transparent; cursor: not-allowed; }
  .arco-btn-group { display: inline-flex; }
  .arco-btn-group .arco-btn { border-radius: 0; }
  .arco-btn-group .arco-btn:first-child { border-radius: var(--forge-radius-sm) 0 0 var(--forge-radius-sm); }
  .arco-btn-group .arco-btn:last-child { border-radius: 0 var(--forge-radius-sm) var(--forge-radius-sm) 0; }
  .arco-btn-group .arco-btn + .arco-btn { margin-left: -1px; }

  /* ============ 表单 Arco Input / Select ============ */
  .arco-input, .arco-select, .arco-textarea {
    width: 100%; height: 32px; padding: 0 12px; font-size: 14px; color: var(--forge-text-1);
    background: var(--forge-card); border: 1px solid var(--forge-border-2); border-radius: var(--forge-radius-sm);
    outline: none; transition: border-color .15s ease, box-shadow .15s ease;
  }
  .arco-textarea { height: auto; padding: 8px 12px; line-height: 1.5715; resize: vertical; }
  .arco-input::placeholder, .arco-textarea::placeholder { color: var(--forge-text-4); }
  .arco-input:hover, .arco-select:hover, .arco-textarea:hover { border-color: var(--forge-primary-5); }
  .arco-input:focus, .arco-textarea:focus { border-color: var(--forge-primary-6); box-shadow: var(--forge-focus-ring); }
  .arco-input.arco-input-error, .arco-textarea.arco-input-error { border-color: var(--forge-error); }
  .arco-input.arco-input-error:focus { box-shadow: 0 0 0 2px var(--forge-error-focus); }
  .arco-select { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; color: var(--forge-text-1); }
  .arco-select .select-placeholder { color: var(--forge-text-4); }
  .arco-select .icon { width: 14px; height: 14px; color: var(--forge-text-3); }
  .arco-select-view-tags { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px 28px 3px 8px; height: auto; min-height: 32px; align-items: center; position: relative; }
  .arco-select-view-tags .icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }
  .arco-input-prefix { position: relative; }
  .arco-input-prefix .arco-input { padding-left: 32px; }
  .arco-input-prefix .prefix-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--forge-text-3); }
  .arco-input-suffix { position: relative; }
  .arco-input-suffix .arco-input { padding-right: 32px; }
  .arco-input-suffix .suffix-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--forge-text-3); cursor: pointer; }
  .arco-form-item { margin-bottom: 20px; }
  .arco-form-label { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; font-size: 14px; color: var(--forge-text-2); }
  .arco-form-label .req { color: var(--forge-error); }
  .arco-form-help { margin-top: 4px; font-size: 12px; color: var(--forge-text-3); }
  .arco-form-help.error { color: var(--forge-error); }

  .arco-radio, .arco-checkbox { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--forge-text-1); cursor: pointer; }
  .radio-dot { width: 16px; height: 16px; border: 2px solid var(--forge-border-3); border-radius: 50%; position: relative; flex: none; background: var(--forge-card); }
  .arco-radio.is-checked .radio-dot { border-color: var(--forge-primary-6); }
  .arco-radio.is-checked .radio-dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--forge-primary-6); }
  .check-box { width: 16px; height: 16px; border: 1.5px solid var(--forge-border-3); border-radius: 3px; position: relative; flex: none; background: var(--forge-card); }
  .arco-checkbox.is-checked .check-box { background: var(--forge-primary-6); border-color: var(--forge-primary-6); }
  .arco-checkbox.is-checked .check-box::after {
    content: ""; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px;
    border: solid var(--forge-primary-foreground); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .arco-switch { width: 36px; height: 20px; border-radius: 10px; background: var(--forge-fill-4); position: relative; cursor: pointer; transition: background-color .15s ease; flex: none; }
  .arco-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--forge-card); transition: left .15s ease; box-shadow: var(--forge-switch-shadow); }
  .arco-switch.is-checked { background: var(--forge-primary-6); }
  .arco-switch.is-checked::after { left: 18px; }

  /* ============ 标签 Arco Tag ============ */
  .arco-tag {
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
    font-size: 12px; line-height: 1; border-radius: var(--forge-radius-sm);
    background: var(--forge-fill-2); color: var(--forge-text-2); white-space: nowrap;
  }
  .arco-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .arco-tag-blue { background: var(--forge-primary-1); color: var(--forge-primary-6); }
  .arco-tag-green { background: var(--forge-success-bg); color: var(--forge-success); }
  .arco-tag-orange { background: var(--forge-warning-bg); color: var(--forge-warning); }
  .arco-tag-red { background: var(--forge-error-bg); color: var(--forge-error); }
  .arco-tag-purple { background: var(--forge-purple-bg); color: var(--forge-purple); }
  .arco-tag-outline { background: var(--forge-card); border: 1px solid var(--forge-border-2); }
  .arco-tag .icon { width: 12px; height: 12px; }
  .arco-tag-clickable { cursor: pointer; }
  .arco-tag-checkable { cursor: pointer; border: 1px solid transparent; }
  .arco-tag-checkable.is-checked { background: var(--forge-primary-1); color: var(--forge-primary-6); }

  /* ============ 卡片 Arco Card ============ */
  .arco-card { background: var(--forge-card); border: 1px solid var(--forge-border-1); border-radius: 4px; }
  .arco-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--forge-border-1); min-height: 49px; }
  .arco-card-title { font-size: 16px; font-weight: 600; color: var(--forge-text-1); display: flex; align-items: center; gap: 8px; }
  .arco-card-title .icon { width: 16px; height: 16px; color: var(--forge-primary-6); }
  .arco-card-extra { font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .arco-card-body { padding: 20px; }
  .arco-card-body.tight { padding: 12px 20px; }
  .arco-card-body.flush { padding: 0; }
  .arco-card-hover { cursor: pointer; transition: box-shadow .18s ease, border-color .18s ease; }
  .arco-card-hover:hover { box-shadow: var(--forge-shadow-1); border-color: var(--forge-border-2); }
  .arco-grid { display: grid; gap: 16px; }

  /* ============ 表格 Arco Table ============ */
  .arco-table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--forge-card); }
  .arco-table thead th {
    background: var(--forge-fill-1); color: var(--forge-text-2); font-weight: 500;
    text-align: left; padding: 10px 16px; font-size: 13px; white-space: nowrap;
    border-bottom: 1px solid var(--forge-border-2);
  }
  .arco-table tbody td { padding: 12px 16px; border-bottom: 1px solid var(--forge-border-1); color: var(--forge-text-1); vertical-align: middle; }
  .arco-table tbody tr { transition: background-color .12s ease; }
  .arco-table tbody tr:hover { background: var(--forge-fill-1); }
  .arco-table tbody tr:last-child td { border-bottom: none; }
  .arco-table .col-check { width: 36px; }
  .arco-table .col-num { text-align: right; }
  .arco-table .strong-cell { font-weight: 500; color: var(--forge-text-1); }
  .arco-table .link-cell { color: var(--forge-primary-6); cursor: pointer; }
  .arco-table .link-cell:hover { color: var(--forge-primary-5); }
  .table-toolbar { display: flex; align-items: center; gap: 8px; padding: 14px 16px; flex-wrap: wrap; }
  .table-toolbar .toolbar-title { font-size: 14px; font-weight: 600; margin-right: auto; }
  .table-footer { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }

  .arco-pagination { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--forge-text-2); }
  .page-btn { min-width: 28px; height: 28px; padding: 0 6px; display: grid; place-items: center; border: 1px solid var(--forge-border-2); border-radius: var(--forge-radius-sm); background: var(--forge-card); cursor: pointer; color: var(--forge-text-2); }
  .page-btn:hover { color: var(--forge-primary-6); border-color: var(--forge-primary-6); }
  .page-btn.is-active { background: var(--forge-primary-6); border-color: var(--forge-primary-6); color: var(--forge-primary-foreground); }

  /* ============ Tabs ============ */
  .arco-tabs-nav { display: flex; align-items: center; gap: 24px; border-bottom: 1px solid var(--forge-border-2); position: relative; }
  .arco-tab {
    position: relative; padding: 10px 2px; font-size: 14px; color: var(--forge-text-2); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: color .15s ease;
  }
  .arco-tab:hover { color: var(--forge-primary-6); }
  .arco-tab.is-active { color: var(--forge-primary-6); font-weight: 500; }
  .arco-tab.is-active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--forge-primary-6); border-radius: 2px;
  }
  .arco-tab .tab-count { font-size: 12px; background: var(--forge-fill-2); color: var(--forge-text-3); border-radius: 9px; padding: 0 6px; line-height: 16px; }
  .arco-tab.is-active .tab-count { background: var(--forge-primary-1); color: var(--forge-primary-6); }
  .arco-tabs-capsule .arco-tabs-nav { border-bottom: none; gap: 4px; background: var(--forge-fill-2); padding: 4px; border-radius: 4px; display: inline-flex; }
  .arco-tabs-capsule .arco-tab { padding: 5px 14px; border-radius: var(--forge-radius-sm); }
  .arco-tabs-capsule .arco-tab.is-active { background: var(--forge-card); color: var(--forge-text-1); box-shadow: var(--forge-shadow-1); }
  .arco-tabs-capsule .arco-tab.is-active::after { display: none; }

  /* ============ 面包屑 ============ */
  .arco-breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--forge-text-3); min-width: 0; }
  .arco-breadcrumb .bc-item { white-space: nowrap; }
  .arco-breadcrumb .bc-link { cursor: pointer; }
  .arco-breadcrumb .bc-link:hover { color: var(--forge-primary-6); }
  .arco-breadcrumb .bc-current { color: var(--forge-text-1); }
  .arco-breadcrumb .icon { width: 12px; height: 12px; }

  /* ============ 徽标/头像 ============ */
  .arco-badge-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--forge-error); border: 1.5px solid var(--forge-card); }
  .arco-badge-count {
    position: absolute; top: -4px; right: -8px; min-width: 16px; height: 16px; padding: 0 4px;
    background: var(--forge-error); color: var(--forge-primary-foreground); font-size: 11px; line-height: 16px; text-align: center;
    border-radius: 8px; border: 1.5px solid var(--forge-card);
  }
  .arco-avatar {
    width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center;
    font-size: 12px; font-weight: 600; flex: none; color: var(--forge-primary-foreground);
