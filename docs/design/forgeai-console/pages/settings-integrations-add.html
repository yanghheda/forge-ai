@layer theme, base, components, utilities;

/*
  ForgeAI Console 品牌令牌
  视觉基线：Arco Design（@arco-design/web-react）B 端中后台语言
  - 主色 arcoblue-6 #165DFF，中性色采用 Arco gray 文本/填充/边框阶梯
  - 控件小圆角 2px，弹层 4px，大容器 8/12px
  - 基准字号 14px，4px 间距网格
  仅定义令牌与排版基线；组件样式见 partials/project-shell.html 内 critical CSS
*/
:root {
  /* ===== 语义别名（Tailwind 语义令牌映射，禁止改名） ===== */
  --forge-background: #f7f8fa;
  --forge-foreground: #1d2129;
  --forge-card: #ffffff;
  --forge-card-foreground: #1d2129;
  --forge-popover: #ffffff;
  --forge-popover-foreground: #1d2129;
  --forge-primary: #165dff;
  --forge-primary-foreground: #ffffff;
  --forge-muted: #f7f8fa;
  --forge-muted-foreground: #86909c;
  --forge-destructive: #f53f3f;
  --forge-destructive-foreground: #ffffff;
  --forge-border: #e5e6eb;
  --forge-input: #e5e6eb;
  --forge-ring: #165dff;

  --forge-sidebar: #1d2129;
  --forge-sidebar-foreground: rgba(255, 255, 255, 0.72);
  --forge-sidebar-primary: #165dff;
  --forge-sidebar-primary-foreground: #ffffff;
  --forge-sidebar-accent: rgba(255, 255, 255, 0.08);
  --forge-sidebar-accent-foreground: #ffffff;

  --forge-chart-1: #165dff;
  --forge-chart-2: #00b42a;
  --forge-chart-3: #ff7d00;
  --forge-chart-4: #f53f3f;
  --forge-chart-5: #722ed1;

  --forge-radius-sm: 2px;
  --forge-radius-md: 8px;
  --forge-radius-lg: 12px;

  /* ===== Arco 文本阶梯 ===== */
  --forge-text-1: #1d2129;
  --forge-text-2: #4e5969;
  --forge-text-3: #86909c;
  --forge-text-4: #c9cdd4;

  /* ===== Arco 填充阶梯 ===== */
  --forge-fill-1: #f7f8fa;
  --forge-fill-2: #f2f3f5;
  --forge-fill-3: #e5e6eb;
  --forge-fill-4: #c9cdd4;

  /* ===== Arco 边框阶梯 ===== */
  --forge-border-1: #f2f3f5;
  --forge-border-2: #e5e6eb;
  --forge-border-3: #c9cdd4;

  /* ===== 主色 arcoblue 阶梯 ===== */
  --forge-primary-1: #e8f3ff;
  --forge-primary-2: #bedaff;
  --forge-primary-3: #94bfff;
  --forge-primary-4: #6aa1ff;
  --forge-primary-5: #4080ff;
  --forge-primary-6: #165dff;
  --forge-primary-7: #0e42d2;
  --forge-primary-8: #072ca6;

  /* ===== 功能色（Arco green/orange/red/purple） ===== */
  --forge-success: #00b42a;
  --forge-success-5: #23c343;
  --forge-success-7: #009a29;
  --forge-success-bg: #e8ffea;
  --forge-success-border: #aff0b5;
  --forge-warning: #ff7d00;
  --forge-warning-5: #ff9a2e;
  --forge-warning-7: #d25f00;
  --forge-warning-bg: #fff7e8;
  --forge-warning-border: #ffcf8b;
  --forge-error: #f53f3f;
  --forge-error-5: #ff7d7d;
  --forge-error-7: #cb2634;
  --forge-error-bg: #ffece8;
  --forge-error-border: #fdcdc5;
  --forge-purple: #722ed1;
  --forge-purple-5: #8f4dff;
  --forge-purple-bg: #f5e8ff;
  --forge-cyan: #0fc6c2;
  --forge-cyan-5: #37d4cf;
  --forge-cyan-bg: #e8fffb;
  --forge-gold: #f7ba1e;
  --forge-gold-bg: #fff7e8;

  /* ===== 焦点环 / 控件投影 ===== */
  --forge-primary-focus-ring: rgba(22, 93, 255, 0.12);
  --forge-error-focus: rgba(245, 63, 63, 0.12);
  --forge-switch-shadow: 0 1px 2px rgba(29, 33, 41, 0.05);

  /* ===== 阴影（Arco elevation；静态面 alpha≤0.05，浮层使用语义命名深阴影） ===== */
  --forge-shadow-1: 0 1px 3px rgba(29, 33, 41, 0.04);
  --forge-popover-shadow: 0 4px 10px rgba(29, 33, 41, 0.1);
  --forge-modal-shadow: 0 10px 30px rgba(29, 33, 41, 0.15);
  --forge-focus-ring: 0 0 0 2px rgba(22, 93, 255, 0.12);

  /* ===== 深色侧边栏表面（令牌化，禁止在页面中写裸 rgba） ===== */
  --forge-sidebar-text: rgba(255, 255, 255, 0.72);
  --forge-sidebar-text-dim: rgba(255, 255, 255, 0.42);
  --forge-sidebar-text-faint: rgba(255, 255, 255, 0.35);
  --forge-sidebar-border: rgba(255, 255, 255, 0.06);
  --forge-sidebar-hover: rgba(255, 255, 255, 0.08);
  --forge-sidebar-chip: rgba(255, 255, 255, 0.05);
  --forge-sidebar-chip-border: rgba(255, 255, 255, 0.08);
  --forge-sidebar-active-bg: rgba(22, 93, 255, 0.22);
  --forge-sidebar-active-bar: #4080ff;
  --forge-sidebar-icon: rgba(255, 255, 255, 0.45);

  /* ===== 浮层遮罩 / 深色代码面 / 滚动条 ===== */
  --forge-mask: rgba(29, 33, 41, 0.45);
  --forge-surface-dark: #232324;
  --forge-text-inverse: #f2f3f5;
  --forge-scrollbar: rgba(201, 205, 212, 0.2);
  --forge-scrollbar-hover: rgba(201, 205, 212, 0.4);

  /* ===== 认证品牌区 ===== */
  --forge-auth-hero-from: #0e42d2;
  --forge-auth-hero-to: #4080ff;
  --forge-hero-chip-bg: rgba(255, 255, 255, 0.16);
  --forge-hero-chip-border: rgba(255, 255, 255, 0.28);
  --forge-hero-glow: rgba(255, 255, 255, 0.16);
  --forge-hero-glow-soft: rgba(255, 255, 255, 0.12);
  --forge-hero-text: rgba(255, 255, 255, 0.82);
  --forge-hero-text-dim: rgba(255, 255, 255, 0.72);
  --forge-hero-text-faint: rgba(255, 255, 255, 0.6);

  /* ===== 排版 ===== */
  --forge-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue",
    Helvetica, Arial, sans-serif;
  --forge-font-mono: "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas,
    "Liberation Mono", "Courier New", monospace;

  --forge-text-xs: 12px;
  --forge-text-sm: 13px;
  --forge-text-base: 14px;
  --forge-text-md: 16px;
  --forge-text-lg: 20px;
  --forge-text-xl: 24px;
  --forge-text-2xl: 28px;

  --forge-leading-tight: 1.4;
  --forge-leading-normal: 1.5715;

  /* ===== 布局尺寸 ===== */
  --forge-sidebar-width: 232px;
  --forge-sidebar-collapsed: 48px;
  --forge-header-height: 56px;
  --forge-content-padding: 20px;
}

/* 深色令牌（预留：未来暗色主题 / 深色面板） */
.dark {
  --forge-background: #17171a;
  --forge-foreground: #f7f8fa;
  --forge-card: #232324;
  --forge-card-foreground: #f7f8fa;
  --forge-popover: #2a2a2c;
  --forge-popover-foreground: #f7f8fa;
  --forge-muted: #232324;
  --forge-muted-foreground: #86909c;
  --forge-border: #3d3d3f;
  --forge-input: #4e4e50;
  --forge-text-1: #f7f8fa;
  --forge-text-2: #c9cdd4;
  --forge-text-3: #86909c;
  --forge-fill-1: #232324;
  --forge-fill-2: #2a2a2c;
  --forge-fill-3: #3d3d3f;
  --forge-border-1: #2a2a2c;
  --forge-border-2: #3d3d3f;
}

html,
body {
  font-family: var(--forge-font-sans);
  font-size: var(--forge-text-base);
  line-height: var(--forge-leading-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

code,
pre,
kbd,
samp {
  font-family: var(--forge-font-mono);
}

<style id="critical-components">
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--forge-text-1); background: var(--forge-fill-1); font-family: inherit; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--forge-fill-3); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .icon { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }

  .arco-form-item { margin-bottom: 20px; }
  .arco-form-label { display: flex; align-items: center; margin-bottom: 6px; font-size: 13px; color: var(--forge-text-2); font-weight: 500; }
  .arco-form-label .req { color: var(--forge-error); margin-right: 2px; }
  .arco-input { width: 100%; height: 36px; padding: 0 12px; font-size: 14px; color: var(--forge-text-1); background: var(--forge-card); border: 1px solid var(--forge-border-2); border-radius: var(--forge-radius-sm); outline: none; transition: border-color .15s ease, box-shadow .15s ease; }
  .arco-input::placeholder { color: var(--forge-text-4); }
  .arco-input:hover { border-color: var(--forge-primary-5); }
  .arco-input:focus { border-color: var(--forge-primary-6); box-shadow: var(--forge-focus-ring); }

  .arco-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 16px; font-size: 14px; border-radius: var(--forge-radius-sm); cursor: pointer; transition: all .15s ease; border: 1px solid transparent; white-space: nowrap; }
  .arco-btn-primary { background: var(--forge-primary-6); color: var(--forge-primary-foreground); border-color: var(--forge-primary-6); }
  .arco-btn-primary:hover { background: var(--forge-primary-5); border-color: var(--forge-primary-5); }
  .arco-btn-outline { background: var(--forge-card); border-color: var(--forge-border-3); color: var(--forge-text-1); }
  .arco-btn-outline:hover { border-color: var(--forge-primary-5); color: var(--forge-primary-6); }

  .arco-select { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; font-size: 14px; color: var(--forge-text-1); background: var(--forge-card); border: 1px solid var(--forge-border-2); border-radius: var(--forge-radius-sm); cursor: pointer; transition: border-color .15s ease; }
  .arco-select:hover { border-color: var(--forge-primary-5); }
  .arco-select .icon { width: 14px; height: 14px; color: var(--forge-text-3); }
  .form-hint { font-size: 12px; color: var(--forge-text-4); margin-top: 4px; line-height: 1.5; }

  .arco-drawer-mask { position: fixed; inset: 0; background: var(--forge-mask); z-index: 1001; }
  .arco-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100vw; background: var(--forge-card); z-index: 1002; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.08); }
  .arco-drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--forge-border-1); flex: none; }
  .arco-drawer-title { font-size: 16px; font-weight: 600; color: var(--forge-text-1); }
  .modal-close { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--forge-radius-sm); color: var(--forge-text-3); cursor: pointer; }
  .modal-close:hover { background: var(--forge-fill-2); color: var(--forge-text-1); }
  .modal-close .icon { width: 16px; height: 16px; }
  .arco-drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .arco-drawer-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 24px 16px; border-top: 1px solid var(--forge-border-1); background: var(--forge-fill-1); flex: none; }
  .arco-drawer-footer .arco-btn { width: auto; padding: 0 20px; }

  .integration-type-card { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--forge-border-2); border-radius: var(--forge-radius-sm); cursor: pointer; transition: all .15s ease; }
  .integration-type-card:hover { border-color: var(--forge-primary-5); }
  .integration-type-card.is-selected { border-color: var(--forge-primary-6); background: var(--forge-primary-1); }
  .integration-type-card .ic { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--forge-radius-sm); background: var(--forge-fill-2); color: var(--forge-text-2); flex: none; }
  .integration-type-card.is-selected .ic { background: var(--forge-primary-1); color: var(--forge-primary-6); }
  .integration-type-card .ic .icon { width: 18px; height: 18px; }
  .integration-type-card .info { min-width: 0; }
  .integration-type-card .name { font-size: 13px; font-weight: 600; color: var(--forge-text-1); }
  .integration-type-card .desc { font-size: 11px; color: var(--forge-text-3); }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5v7M6 12h6c2 0 4-1 4-3"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12 7.6L4 21l1.9-5A8.4 8.4 0 1 1 21 11.5z"/></symbol>
  <symbol id="i-webhook" viewBox="0 0 24 24"><path d="M10 6a2 2 0 1 1 4 0c0 .8-.4 1.5-1 1.8v.2l4 7h2a2 2 0 1 1 0 4h-3a2 2 0 0 1-1.8-1L10 10"/></symbol>
  <symbol id="i-api" viewBox="0 0 24 24"><path d="M8 3H6a2 2 0 0 0-2 2v4M16 3h2a2 2 0 0 1 2 2v4M8 21H6a2 2 0 0 1-2-2v-4M16 21h2a2 2 0 0 0 2-2v-4"/></symbol>
  <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/></symbol>
</svg>

<!-- 模拟背景 -->
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;">
  <div style="position:absolute;top:24px;left:24px;font-size:13px;color:var(--forge-text-4);line-height:1.6;">
    <strong style="color:var(--forge-text-2);font-size:14px;">集成配置 - 添加集成</strong><br/>
    点击集成配置页"添加集成"按钮触发 · 右侧抽屉
  </div>
</div>

<!-- 添加集成抽屉 -->
<div class="arco-drawer-mask" data-dom-id="drawer-add-integration-mask"></div>
<aside class="arco-drawer" data-dom-id="drawer-add-integration">
  <div class="arco-drawer-head">
    <span class="arco-drawer-title">添加集成</span>
    <span class="modal-close"><svg class="icon"><use href="#i-close"/></svg></span>
  </div>
  <div class="arco-drawer-body">
    <div class="arco-form-item">
      <label class="arco-form-label"><span><span class="req">*</span>集成类型</span></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="integration-type-card is-selected">
          <div class="ic"><svg class="icon"><use href="#i-branch"/></svg></div>
          <div class="info"><div class="name">GitLab</div><div class="desc">代码仓库与 CI/CD</div></div>
        </div>
        <div class="integration-type-card">
          <div class="ic"><svg class="icon"><use href="#i-chat"/></svg></div>
          <div class="info"><div class="name">飞书</div><div class="desc">消息通知与审批</div></div>
        </div>
        <div class="integration-type-card">
          <div class="ic"><svg class="icon"><use href="#i-webhook"/></svg></div>
          <div class="info"><div class="name">Webhook</div><div class="desc">自定义事件推送</div></div>
        </div>
        <div class="integration-type-card">
          <div class="ic"><svg class="icon"><use href="#i-api"/></svg></div>
          <div class="info"><div class="name">REST API</div><div class="desc">外部系统对接</div></div>
        </div>
      </div>
    </div>
    <div class="arco-form-item">
      <label class="arco-form-label"><span><span class="req">*</span>集成名称</span></label>
      <input class="arco-input" type="text" placeholder="如：公司 GitLab 实例">
    </div>
    <div class="arco-form-item">
      <label class="arco-form-label"><span><span class="req">*</span>GitLab 地址</span></label>
      <input class="arco-input" type="text" placeholder="https://gitlab.example.com">
    </div>
    <div class="arco-form-item">
      <label class="arco-form-label"><span><span class="req">*</span>Access Token</span></label>
      <input class="arco-input" type="password" placeholder="glpat-xxxxxxxxxxxxxxxxxxxx">
      <div class="form-hint">在 GitLab → Settings → Access Tokens 中创建，需要 api scope 权限</div>
    </div>
    <div class="arco-form-item">
      <label class="arco-form-label"><span>默认项目组</span></label>
      <input class="arco-input" type="text" placeholder="如：forgeai（自动同步该组下仓库）">
    </div>
    <div class="arco-form-item">
      <label class="arco-form-label"><span>Webhook Secret</span></label>
      <input class="arco-input" type="password" placeholder="用于验证 Webhook 回调签名">
      <div class="form-hint">可选，用于增强 Webhook 安全性</div>
    </div>
    <div class="arco-form-item">
      <label class="arco-form-label"><span>同步策略</span></label>
      <div class="arco-select"><span>增量同步（仅推送变更）</span><svg class="icon"><use href="#i-chevron-down"/></svg></div>
    </div>
    <div class="arco-form-item" style="margin-bottom:0;">
      <div style="display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:var(--forge-warning-bg);border:1px solid var(--forge-warning-border);border-radius:var(--forge-radius-sm);">
        <svg class="icon" style="width:16px;height:16px;color:var(--forge-warning);flex:none;margin-top:1px;"><use href="#i-warning"/></svg>
        <span style="font-size:12.5px;color:var(--forge-text-2);line-height:1.6;">Token 仅用于服务端调用 GitLab API，不会暴露给前端或 Agent。Agent 通过受控 Tool API 间接访问，不直接持有 Token。</span>
      </div>
    </div>
  </div>
  <div class="arco-drawer-footer">
    <button class="arco-btn arco-btn-outline" type="button">取消</button>
    <button class="arco-btn arco-btn-primary" type="button" data-dom-id="drawer-add-integration-submit">测试并保存</button>
  </div>
</aside>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
