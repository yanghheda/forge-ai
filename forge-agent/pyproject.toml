[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.1.0"
description = "ForgeAI 受控 Agent Runtime 骨架"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "langgraph==0.6.7",
  "langgraph-checkpoint-sqlite==2.0.11",
  "PyJWT==2.10.1",
  "pydantic-settings==2.10.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "pytest==8.4.1",
  "PyYAML==6.0.2",
  "ruff==0.12.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
