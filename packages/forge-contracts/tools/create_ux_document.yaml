name: create_ux_document
version: 1
description: 在指定 Requirement 下创建 UX Spec 文档；契约权限 ux.document.create 与应用服务内按文档类型判定的创建权限共同构成授权。
input_schema:
  type: object
  required: [requirementId, title]
  properties:
    requirementId: { type: integer, minimum: 1 }
    title: { type: string, minLength: 1, maxLength: 200 }
  additionalProperties: false
output_schema:
  type: object
required_permission: ux.document.create
risk_level: MEDIUM
idempotency:
  required: true
timeout_ms: 5000
retry:
  max_attempts: 1
backend_mapping:
  method: POST
  path: /internal/v1/tools/create_ux_document:execute
sensitive_fields: []
requirement_ids:
  - PRD-10-4
  - PRD-10-5
