name: create_requirement
version: 1
description: 在当前 Run 授权的项目内创建 Requirement 工作项；MEDIUM 风险，默认需要确认。
input_schema:
  type: object
  required: [title]
  properties:
    title: { type: string, minLength: 1, maxLength: 255 }
    description: { type: string, maxLength: 10000 }
    priority: { type: [string, "null"], enum: [LOW, MEDIUM, HIGH, URGENT, null] }
    assigneeId: { type: [integer, "null"], minimum: 1 }
  additionalProperties: false
output_schema:
  type: object
required_permission: requirement.create
risk_level: MEDIUM
idempotency:
  required: true
timeout_ms: 5000
retry:
  max_attempts: 1
backend_mapping:
  method: POST
  path: /internal/v1/tools/create_requirement:execute
sensitive_fields: []
requirement_ids:
  - PRD-10-4
  - PRD-10-5
