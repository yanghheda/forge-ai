name: create_requirement
version: 2
description: 在当前 Run 授权的公司范围内创建 Requirement 工作项；MEDIUM 过程动作默认直接执行。
input_schema:
  type: object
  required: [title, description]
  properties:
    title: { type: string, minLength: 1, maxLength: 255 }
    description: { type: string, minLength: 20, maxLength: 10000 }
    priority: { type: [string, "null"], enum: [LOW, MEDIUM, HIGH, URGENT, null] }
    assigneeId: { type: [integer, "null"], minimum: 1 }
  additionalProperties: false
output_schema:
  type: object
required_permission: requirement.create
risk_level: MEDIUM
idempotency:
  required: true
timeout_ms: 5000
retry:
  max_attempts: 1
backend_mapping:
  method: POST
  path: /internal/v1/tools/create_requirement:execute
sensitive_fields: []
requirement_ids:
  - PRD-10-4
  - PRD-10-5
