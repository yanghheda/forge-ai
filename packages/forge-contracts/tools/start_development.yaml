name: start_development
version: 1
description: 为 Dev Task 创建或恢复 Branch/MR；远端结果未知时保留本地 PROCESSING 意图供 reconcile。
input_schema:
  type: object
  required: [devTaskId]
  properties:
    devTaskId: { type: integer, minimum: 1 }
    targetBranch: { type: string, minLength: 1, maxLength: 255 }
  additionalProperties: false
output_schema:
  type: object
required_permission: task.edit
risk_level: MEDIUM
idempotency:
  required: true
timeout_ms: 15000
retry:
  max_attempts: 1
backend_mapping:
  method: POST
  path: /internal/v1/tools/start_development:execute
sensitive_fields: []
requirement_ids: [PRD-10-6]
