name: publish_document
version: 1
description: 发布需求关联的 PRD 文档当前版本；只有已发布的 PRD 才是产品评审的准入材料。UX 交付文档改用 publish_ux_document。契约权限 document.publish 与应用服务内按文档类型判定的发布权限共同构成授权。
input_schema:
  type: object
  required: [documentId, expectedVersion]
  properties:
    documentId: { type: integer, minimum: 1 }
    versionId: { type: [integer, "null"], minimum: 1 }
    expectedVersion: { type: integer, minimum: 0 }
  additionalProperties: false
output_schema:
  type: object
required_permission: document.publish
risk_level: MEDIUM
idempotency:
  required: true
timeout_ms: 5000
retry:
  max_attempts: 1
backend_mapping:
  method: POST
  path: /internal/v1/tools/publish_document:execute
sensitive_fields: []
requirement_ids:
  - WI-004
