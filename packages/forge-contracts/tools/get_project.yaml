name: get_project
version: 1
description: 读取当前 Run 授权范围内的项目基础信息；不接收任何 scope 参数，范围完全由服务端 Run 上下文决定。
input_schema:
  type: object
  required: []
  properties: {}
  additionalProperties: false
output_schema:
  type: object
required_permission: project.read
risk_level: LOW
idempotency:
  required: false
timeout_ms: 5000
retry:
  max_attempts: 2
backend_mapping:
  method: POST
  path: /internal/v1/tools/get_project:execute
sensitive_fields: []
requirement_ids:
  - PRD-10-4
  - PRD-10-5
