name: advance_task
version: 1
description: 执行角色任务的生命周期动作；目标状态与准入条件由 forge-server 五态任务状态机决定，审核动作永不开放。契约权限 task.read 只是「公司内可读任务」的前置门禁，真正的写入授权由应用服务按任务类型对应的模块权限与需求内执行人身份判定。
input_schema:
  type: object
  required: [taskId, action, expectedVersion]
  properties:
    taskId: { type: integer, minimum: 1 }
    action: { type: string, enum: [START, SUBMIT_REVIEW, BLOCK, UNBLOCK] }
    expectedVersion: { type: integer, minimum: 0 }
    reason: { type: [string, "null"], maxLength: 1000 }
  additionalProperties: false
output_schema:
  type: object
required_permission: task.read
risk_level: MEDIUM
idempotency:
  required: true
timeout_ms: 5000
retry:
  max_attempts: 1
backend_mapping:
  method: POST
  path: /internal/v1/tools/advance_task:execute
sensitive_fields: []
requirement_ids:
  - PRD-10-4
