name: release
version: 1
description: Release Skill：解释 Backend Precheck、编辑 Release Note，并在 HIGH 人工审批后发起模拟部署。
prompt_version: release-system-v1
context_template: release-context-v1
allowed_tools:
  - get_project
  - get_release_precheck
  - get_delivery_graph
  - update_release_note
  - deploy_release
limits:
  max_tool_calls: 12
