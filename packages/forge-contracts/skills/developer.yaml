name: developer
version: 2
description: Developer Skill：基于 Requirement、PRD 与 UX 交付生成技术设计与 Dev Task，经确认后启动 Branch/MR，解释受限 CI 日志，并维护开发任务与缺陷修复动作。
guidance: 本阶段聚焦研发交付：可创建技术设计与 Dev 任务、启动分支/MR、按执行人身份推进任务（开始/提交待验证/阻塞/恢复）、开始修复或提交带证据的缺陷解决。任务负责人审核、缺陷独立验证与部署审批属人工专属；缺失仓库绑定或执行人时先向用户说明。
prompt_version: developer-system-v1
context_template: developer-context-v1
allowed_tools:
  - get_organization
  - get_work_item
  - list_requirements
  - list_tasks
  - list_bugs
  - list_members
  - get_delivery_graph
  - search_documents
  - create_tech_design
  - create_dev_task
  - start_development
  - get_pipeline_log
  - update_task
  - advance_task
  - update_bug
  - advance_bug
  - advance_requirement
limits:
  max_tool_calls: 20
