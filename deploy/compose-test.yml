# 测试环境覆盖：隔离容器与数据卷，并将数据服务仅暴露到宿主机回环地址。
name: forge-ai-test

services:
  forge-web:
    ports: !override
      - "127.0.0.1:${FORGE_TEST_WEB_PORT:-13000}:3000"

  forge-server:
    environment:
      SPRING_PROFILES_ACTIVE: test
      FORGE_GITLAB_PROVIDER: demo
      FORGE_ALLOWED_ORIGINS: http://127.0.0.1:${FORGE_TEST_WEB_PORT:-13000},http://localhost:${FORGE_TEST_WEB_PORT:-13000}

  mysql:
    ports:
      - "127.0.0.1:${FORGE_TEST_MYSQL_HOST_PORT:-3306}:3306"

  redis:
    ports:
      - "127.0.0.1:${FORGE_TEST_REDIS_HOST_PORT:-6379}:6379"

  qdrant:
    ports:
      - "127.0.0.1:${FORGE_TEST_QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${FORGE_TEST_QDRANT_GRPC_HOST_PORT:-6334}:6334"

networks:
  forge-internal:
    internal: false
