# 测试环境覆盖：应用容器隔离运行，但仍连接服务器已经存在的 infra-net。
name: forge-ai-test

services:
  forge-web:
    ports: !override
      - "127.0.0.1:${FORGE_TEST_WEB_PORT:-13000}:3000"

  forge-server:
    environment:
      SPRING_PROFILES_ACTIVE: test
      FORGE_GITLAB_PROVIDER: demo
      FORGE_ALLOWED_ORIGINS: http://127.0.0.1:${FORGE_TEST_WEB_PORT:-13000},http://localhost:${FORGE_TEST_WEB_PORT:-13000}

networks:
  forge-internal:
    internal: false
  shared-infrastructure:
    name: ${FORGE_INFRA_NETWORK:-infra-net}
    external: true
