name: forge-ai

services:
  forge-web:
    profiles: ["applications"]
    build:
      context: ../forge-web
    environment:
      FORGE_SERVER_INTERNAL_URL: http://forge-server:8080
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${FORGE_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      forge-server:
        condition: service_healthy
    networks:
      - forge-edge
      - forge-internal
    restart: unless-stopped

  forge-server:
    profiles: ["applications"]
    build:
      context: ..
      dockerfile: forge-server/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${FORGE_SERVER_PROFILE:-prod}
      FORGE_MYSQL_URL: jdbc:mysql://mysql:3306/${FORGE_MYSQL_DATABASE}
      FORGE_MYSQL_USERNAME: ${FORGE_MYSQL_USERNAME}
      FORGE_MYSQL_PASSWORD: ${FORGE_MYSQL_PASSWORD}
      FORGE_REDIS_HOST: redis
      FORGE_QDRANT_BASE_URL: http://qdrant:6333
      FORGE_AGENT_BASE_URL: http://forge-agent:8000
      FORGE_AGENT_INTERNAL_JWT_SECRET: ${FORGE_AGENT_INTERNAL_JWT_SECRET}
      FORGE_SECRET_MASTER_KEY: ${FORGE_SECRET_MASTER_KEY}
      FORGE_GITLAB_PROVIDER: ${FORGE_GITLAB_PROVIDER:-real}
      FORGE_ALLOWED_ORIGINS: http://127.0.0.1:${FORGE_WEB_PORT:-3000},http://localhost:${FORGE_WEB_PORT:-3000}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      forge-agent:
        condition: service_healthy
    networks:
      - forge-internal
    restart: unless-stopped

  forge-agent:
    profiles: ["applications"]
    build:
      context: ../forge-agent
      target: runtime
    environment:
      FORGE_AGENT_INTERNAL_JWT_SECRET: ${FORGE_AGENT_INTERNAL_JWT_SECRET}
      FORGE_AGENT_CHECKPOINT_PATH: /app/data/checkpoints.sqlite
      FORGE_AGENT_CONTRACTS_ROOT: /app/contracts
      FORGE_AGENT_SERVER_BASE_URL: http://forge-server:8080
    volumes:
      - agent-checkpoints:/app/data
      - ../packages/forge-contracts:/app/contracts:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - forge-internal
    restart: unless-stopped

  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: ${FORGE_MYSQL_DATABASE}
      MYSQL_USER: ${FORGE_MYSQL_USERNAME}
      MYSQL_PASSWORD: ${FORGE_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${FORGE_MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - forge-internal
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - forge-internal
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.3
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - forge-internal
    restart: unless-stopped

networks:
  forge-edge:
  forge-internal:
    internal: true

volumes:
  agent-checkpoints:
  mysql-data:
  qdrant-data:
