name: forge-ai

services:
  forge-web:
    profiles: ["applications"]
    image: ${FORGE_IMAGE_PREFIX:-ghcr.io/yanghheda}/forge-web:${FORGE_IMAGE_TAG:-latest}
    build:
      context: ../forge-web
    environment:
      FORGE_SERVER_INTERNAL_URL: http://forge-server:8080
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      forge-server:
        condition: service_healthy
    networks:
      forge-internal:
      # 接入共享边缘 nginx 所用的别名；forge-web 不接收任何数据服务凭据（ADR-027）。
      shared-infrastructure:
        aliases:
          - forge-web
    restart: unless-stopped

  forge-server:
    profiles: ["applications"]
    image: ${FORGE_IMAGE_PREFIX:-ghcr.io/yanghheda}/forge-server:${FORGE_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: forge-server/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${FORGE_SERVER_PROFILE:-prod}
      FORGE_MYSQL_URL: jdbc:mysql://${FORGE_MYSQL_HOST:-mysql}:${FORGE_MYSQL_PORT:-3306}/${FORGE_MYSQL_DATABASE}
      FORGE_MYSQL_USERNAME: ${FORGE_MYSQL_USERNAME}
      FORGE_MYSQL_PASSWORD: ${FORGE_MYSQL_PASSWORD}
      FORGE_REDIS_HOST: ${FORGE_REDIS_HOST:-redis}
      FORGE_REDIS_PORT: ${FORGE_REDIS_PORT:-6379}
      FORGE_REDIS_PASSWORD: ${FORGE_REDIS_PASSWORD:-}
      FORGE_REDIS_NAMESPACE: ${FORGE_REDIS_NAMESPACE:-forge-ai}
      FORGE_QDRANT_BASE_URL: ${FORGE_QDRANT_BASE_URL:-http://qdrant:6333}
      FORGE_QDRANT_API_KEY: ${FORGE_QDRANT_API_KEY:-}
      FORGE_QDRANT_COLLECTION_PREFIX: ${FORGE_QDRANT_COLLECTION_PREFIX:-forge_ai_}
      FORGE_AGENT_BASE_URL: http://forge-agent:8000
      FORGE_AGENT_INTERNAL_JWT_SECRET: ${FORGE_AGENT_INTERNAL_JWT_SECRET}
      FORGE_SECRET_MASTER_KEY: ${FORGE_SECRET_MASTER_KEY}
      FORGE_GITLAB_PROVIDER: ${FORGE_GITLAB_PROVIDER:-real}
      # 浏览器侧来源白名单；生产环境必须覆盖为实际入口域名（如 https://forgeai.yjxai.cloud）。
      FORGE_ALLOWED_ORIGINS: ${FORGE_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      forge-agent:
        condition: service_healthy
    networks:
      - forge-internal
      - shared-infrastructure
    restart: unless-stopped

  forge-agent:
    profiles: ["applications"]
    image: ${FORGE_IMAGE_PREFIX:-ghcr.io/yanghheda}/forge-agent:${FORGE_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: forge-agent/Dockerfile
      target: runtime
    environment:
      FORGE_AGENT_INTERNAL_JWT_SECRET: ${FORGE_AGENT_INTERNAL_JWT_SECRET}
      FORGE_AGENT_CHECKPOINT_PATH: /app/data/checkpoints.sqlite
      FORGE_AGENT_CONTRACTS_ROOT: /app/contracts
      FORGE_AGENT_SERVER_BASE_URL: http://forge-server:8080
      FORGE_AGENT_MODEL_PROVIDER: ${FORGE_AGENT_MODEL_PROVIDER:-fake}
      FORGE_AGENT_QWEN_API_KEY: ${DASHSCOPE_API_KEY:-}
      FORGE_AGENT_QWEN_BASE_URL: ${FORGE_AGENT_QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      FORGE_AGENT_QWEN_MODEL: ${FORGE_AGENT_QWEN_MODEL:-qwen-plus}
      FORGE_AGENT_QWEN_TIMEOUT_SECONDS: ${FORGE_AGENT_QWEN_TIMEOUT_SECONDS:-60}
      FORGE_AGENT_QWEN_MAX_ATTEMPTS: ${FORGE_AGENT_QWEN_MAX_ATTEMPTS:-2}
      FORGE_AGENT_QWEN_RETRY_BACKOFF_SECONDS: ${FORGE_AGENT_QWEN_RETRY_BACKOFF_SECONDS:-0.25}
    volumes:
      - agent-checkpoints:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - forge-internal
    restart: unless-stopped

networks:
  forge-internal:
    internal: true
  shared-infrastructure:
    external: true
    name: ${FORGE_INFRA_NETWORK:-infra-net}

volumes:
  agent-checkpoints:
