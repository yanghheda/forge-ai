name: forge-ai

services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: ${FORGE_MYSQL_DATABASE}
      MYSQL_USER: ${FORGE_MYSQL_USERNAME}
      MYSQL_PASSWORD: ${FORGE_MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - forge-internal
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - forge-internal
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.3
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - forge-internal
    restart: unless-stopped

networks:
  forge-internal:
    internal: true

volumes:
  mysql-data:
  qdrant-data:
